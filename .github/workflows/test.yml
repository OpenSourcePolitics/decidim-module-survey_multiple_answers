name: "[CI] Test"

on:
  push:
    branches:
      - main
  pull_request:

env:
  CI: "true"
  CODECOV: "true"
  RUBY_VERSION: 3.3.4
  NODE_VERSION: 22.14.0
  RAILS_ENV: test

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DISABLE_SPRING: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Create test app
        run: bundle exec rake test_app
        shell: "bash"
      - run: |
          rm -f ./spec/decidim_dummy_app/app/services/dummy_signature_handler.rb
          rm -f ./spec/decidim_dummy_app/app/services/dummy_sms_mobile_phone_validator.rb
        name: Remove Initiative-dependent dummy files
      - name: Run RSpec
        run: bundle exec rspec --exclude-pattern "spec/i18n_spec.rb"
        env:
          SIMPLECOV: 1
          CODECOV: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ./spec/decidim_dummy_app/tmp/screenshots
