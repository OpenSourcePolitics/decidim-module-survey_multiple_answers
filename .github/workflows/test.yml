name: "[CI] Test"

on:
  push:
    branches:
      - main
  pull_request:

env:
  RSPEC_FORMAT: "documentation"
  RUBY_VERSION: 3.3.4
  RAILS_ENV: test
  NODE_ENV: test
  NODE_VERSION: 22.14.0

jobs:
  test-report:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:11
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      RUBY_VERSION: ${{ env.RUBY_VERSION }}
      NODE_VERSION: ${{ env.NODE_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: gem update uri
        name: update uri
      - name: Setup Database
        run: bundle exec rake test_app
      - run: |
          rm -f ./spec/decidim_dummy_app/app/services/dummy_signature_handler.rb
          rm -f ./spec/decidim_dummy_app/app/services/dummy_sms_mobile_phone_validator.rb
        name: Remove Initiative-dependent dummy files
      - name: Run RSpec
        run: bundle exec rspec --exclude-pattern "spec/i18n_spec.rb"
        env:
          SIMPLECOV: 1
          CODECOV: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ./spec/decidim_dummy_app/tmp/screenshots
